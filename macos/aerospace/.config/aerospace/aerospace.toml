[[on-window-detected]]
if.app-id = "com.apple.Notes"
run = ['layout floating']

[[on-window-detected]]
if.app-id = "com.apple.Photos"
run = ['layout floating']

[[on-window-detected]]
if.app-id = "com.apple.Preview"
