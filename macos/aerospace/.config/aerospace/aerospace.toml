# ==============================================================================
# Floating window
# ==============================================================================
[[on-window-detected]]
if.app-id = "com.apple.Passwords"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.apple.finder"
run = ["layout floating"]

[[on-window-detected]]
if.app-id = "com.apple.ActivityMonitor"
run = ["layout floating"]

[[on-window-detected]]
if.app-name-regex-substring = 'System Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = "com.apple.Notes"
run = ['layout floating']

[[on-window-detected]]
if.app-name-regex-substring = 'Photos'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'Preview'
run = 'layout floating'
[[on-window-detected]]
if.app-name-regex-substring = 'App Store'
run = 'layout floating'

[[on-window-detected]]
if.app-id = "com.sublimetext.4"
run = ["layout floating"]

# Non-Apple application ------------------------
[[on-window-detected]]
if.app-id = "com.tencent.lemon"
run = ["layout floating"]

[[on-window-detected]]
if.app-name-regex-substring = 'Karabiner'
run = ['layout floating']

[[on-window-detected]]
if.app-id = "com.electron.dockerdesktop"
run = ['layout floating']


# force certain workspaces to certain monitors
# [workspace-to-monitor-force-assignment]
# 1 = 'main'                  # Monitor sequence number from left to right. 1-based indexing
# 2 = 'main'                  # Main monitor
# 3 = 'main'                  # Non-main monitor in case when there are only two monitors
# 4 = 'main'                  # Non-main monitor in case when there are only two monitors
# 5 = 'main'
# 6 = 'main'
# 7 = 'main'
# 8 = 'main'
# 9 = 'secondary'
