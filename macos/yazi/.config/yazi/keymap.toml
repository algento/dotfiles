# 숨김 파일 토글
[[mgr.prepend_keymap]]
on   = ["."]
run  = "hidden toggle"
desc = "Toggle hidden files"

# 파일 압축
[[mgr.prepend_keymap]]
on   = [ "c", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"
