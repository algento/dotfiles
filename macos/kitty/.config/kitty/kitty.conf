# vim:fileencoding=utf-8:ft=kitty
#
# Kitty configuration for macOS. This package is deployed by GNU Stow to
# ~/.config/kitty when running: ./scripts/install.sh --macos

# Fonts
font_family family='JetBrainsMono Nerd Font'
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0
# Ghostty's adjust-cell-width = -6%
modify_font cell_width 94%
# Noto Sans CJK KR is selected automatically as the fallback font for Hangul.
# JetBrains Mono enables calt/liga by default.

# Cursor
cursor_shape block
cursor_blink_interval 0.5

# Theme: Catppuccin Mocha
include current-theme.conf

# Window
remember_window_size no
initial_window_width 120c
initial_window_height 30c
window_padding_width 10 6
background_opacity 0.98
background_blur 20
macos_titlebar_color background
confirm_os_window_close 0

# Shell and interaction
shell /bin/zsh
shell_integration enabled no-title
wheel_scroll_multiplier 0.7
mouse_hide_wait 0.5
clipboard_control write-clipboard no-append

# Panes and tabs
enabled_layouts splits,stack
active_border_color #547792
inactive_border_color #303446
inactive_text_alpha 0.8
tab_bar_style powerline
tab_powerline_style slanted

# Windows and panes
map ctrl+shift+n new_window
map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right

# Kitty can choose horizontal or vertical splits; its default placement is
# after the focused pane, so it cannot exactly reproduce Ghostty's four-sided
# new-split placement.
map ctrl+s>h launch --location=vsplit
map ctrl+s>j launch --location=hsplit
map ctrl+s>k launch --location=hsplit
map ctrl+s>l launch --location=vsplit
map ctrl+s>f toggle_layout stack

# Tabs
map ctrl+s>n next_tab
map ctrl+s>p previous_tab

# Configuration and pane resizing
map super+r load_config_file
map super+ctrl+h resize_window narrower 10
map super+ctrl+j resize_window shorter 10
map super+ctrl+k resize_window taller 10
map super+ctrl+l resize_window wider 10
